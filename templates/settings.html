<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>設定 | 学習記録アプリ</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/records">学習記録アプリ</a>
    <nav>
      <a href="/records">記録</a>
      <a href="/categories">カテゴリ</a>
      <a href="/settings">設定</a>
      <button class="link-button" data-logout>ログアウト</button>
    </nav>
  </header>
  <main class="container narrow">
    <h1>プロフィール設定</h1>
    <p id="message" class="message" aria-live="polite"></p>
    <form id="user-form">
      <label>
        名前
        <input id="name" type="text" required maxlength="100">
      </label>
      <label>
        メールアドレス
        <input id="email" type="email" required maxlength="255">
      </label>
      <button type="submit">変更を保存</button>
    </form>
    <section class="danger-zone">
      <h2>アカウント削除</h2>
      <p>削除すると元に戻せません。</p>
      <button id="delete-user" class="danger" type="button">アカウントを削除</button>
    </section>
  </main>
  <script type="module" src="/static/js/users.js"></script>
</body>
</html>
