<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学習記録 | 学習記録アプリ</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/records">学習記録アプリ</a>
    <nav>
      <a href="/records">記録</a>
      <a href="/categories">カテゴリ</a>
      <a href="/settings">設定</a>
      <button class="link-button" data-logout>ログアウト</button>
    </nav>
  </header>
  <main class="container">
    <div class="page-heading">
      <h1>学習記録</h1>
      <a class="button" href="/record-form">記録を追加</a>
    </div>
    <p id="message" class="message" aria-live="polite"></p>
    <section>
      <h2>カテゴリ別学習時間</h2>
      <div id="summary" class="summary-grid">
        <p>読み込み中...</p>
      </div>
    </section>
    <section>
      <h2>記録一覧</h2>
      <div id="records" class="list">
        <p>読み込み中...</p>
      </div>
    </section>
  </main>
  <script type="module" src="/static/js/records.js"></script>
</body>
</html>
